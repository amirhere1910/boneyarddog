name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnóstico (temporal) de copia-simple en Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node test/copia-simple.test.js
      - run: npm test
